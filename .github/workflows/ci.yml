# Integração contínua: todo push e pull request passa por lint, formatação,
# testes e build. Se algo quebrar, o GitHub avisa antes do merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Formatação (Prettier)
        run: npm run format:check
      - name: Testes (Vitest)
        run: npm test
      - name: Build (Vite)
        run: npm run build
