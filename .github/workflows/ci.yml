# Integração contínua: todo push e pull request passa por lint, formatação,
# testes e build. Se algo quebrar, o GitHub avisa antes do merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Formatação (Prettier)
        run: npm run format:check
      - name: Testes (Vitest)
        run: npm test
      - name: Build (Vite)
        run: npm run build

  # Ponta a ponta no navegador: a jornada completa, acessibilidade (axe + teclado),
  # LGPD, boas-vindas e celular — contra o build de produção.
  e2e:
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta (Playwright)
        run: npm run e2e
      - name: Evidências da falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-resultados
          path: test-results
          retention-days: 7

  # Banco (Supabase/Postgres): RLS, privilégios e funções da jornada, com pgTAP,
  # num Postgres do Supabase em Docker — prova que a segurança está NO BANCO.
  banco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes do banco (pgTAP)
        run: bash scripts/testar-banco.sh

  # A jornada no MODO SUPABASE: Supabase local oficial (CLI), migrações + seed,
  # testes pgTAP pelo CLI e o app construído com VITE_FONTE_DADOS=supabase.
  # Só a chave PÚBLICA (anon) vai para o app; a service_role nunca sai do runner.
  e2e-supabase:
    runs-on: ubuntu-latest
    needs: [qualidade, banco]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.62.10
      - name: Supabase local (Auth + API + Postgres)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,storage-api,postgres-meta,realtime
      - name: Testes do banco pelo CLI (pgTAP)
        run: supabase test db
      - name: URL e chave pública para o app
        run: |
          eval "$(supabase status -o env)"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Jornada no modo Supabase (Playwright)
        run: npm run e2e:supabase
